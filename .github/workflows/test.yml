name: Test

on:
  pull_request:
  push:
    branches:
      - main
      - next

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Exercise the plugin floor and the lint runtime.
        php: ['7.4', '8.3']
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # v2.35.5
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer

      - name: Generate plugin autoloader
        run: composer dump-autoload --no-dev

      - name: Lint PHP syntax
        run: |
          set -euo pipefail
          # The bundled SDK is PHP 8.2+ and runtime-gated; lint it on 8.3 only.
          if [ '${{ matrix.php }}' = '7.4' ]; then
            find . \( -path './vendor' -o -path './php-scoper/vendor' -o -path './vendor_prefixed/sumup-sdk' \) -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
          else
            find . \( -path './vendor' -o -path './php-scoper/vendor' \) -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
          fi

      - name: Regression tests
        run: |
          set -euo pipefail
          for f in tests/regression/*.php; do
            echo "== $f"
            php "$f"
          done

      - name: Install lint dependencies
        if: matrix.php == '8.3'
        run: composer install --no-interaction --prefer-dist

      - name: PHPCS (files owned by the 2.0 server-mode landing)
        if: matrix.php == '8.3'
        # The legacy files carry pre-existing PHPCS debt (139 errors on `next` at 2026-09-09); they are
        # linted when they are cleaned up, not here, so this check reflects the code this lane owns.
        run: vendor/bin/phpcs --standard=./.phpcs.xml.dist sumup-terminal-for-woocommerce.php includes/Settings.php includes/Gateway.php includes/Server includes/Services/RefundClient.php includes/Legacy_Adoption.php

  conformance:
    name: Conformance PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    defaults:
      run:
        working-directory: sumup-terminal-for-woocommerce
    steps:
      - name: Checkout extension
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: sumup-terminal-for-woocommerce
          persist-credentials: false

      # Pro's provider conformance suite runs the real adapter under wp-env with Pro (which vendors
      # Free) as a sibling plugin; see tests/conformance/. The org-level wcpos-bot App mints a token
      # scoped to contents:read on the private Pro repo. Fork PRs get no secrets and stop here by design.
      - name: Read-only Pro token
        id: pro-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.WCPOS_BOT_APP_ID }}
          private-key: ${{ secrets.WCPOS_BOT_PRIVATE_KEY }}
          owner: wcpos
          repositories: woocommerce-pos-pro
          permission-contents: read

      - name: Checkout Pro next as sibling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: wcpos/woocommerce-pos-pro
          ref: next
          path: woocommerce-pos-pro
          token: ${{ steps.pro-token.outputs.token }}
          persist-credentials: false

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # v2.35.5
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          composer install --working-dir=../woocommerce-pos-pro --no-interaction --prefer-dist --no-progress

      - name: Setup Node
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '22'

      - name: Start WordPress test environment
        run: |
          npm i -g @wordpress/env
          printf '{"phpVersion":"%s"}\n' '${{ matrix.php }}' > .wp-env.override.json
          wp-env start

      # Transcripts are compared, never recorded, here: recording is an opt-in inside the PHPUnit
      # process (`wp-env run tests-cli -- env WCPOS_RECORD_TRANSCRIPTS=1 ...`) that CI does not set.
      - name: Provider conformance suite
        run: wp-env run --env-cwd='wp-content/plugins/sumup-terminal-for-woocommerce' tests-cli -- vendor/bin/phpunit -c phpunit.conformance.xml.dist
